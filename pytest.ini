[pytest]
# "pytest" desde la raíz corre la suite de seguridad del TP Final (tests/security_tests.py: el nombre lo pide la
# consigna y no coincide con el patrón test_*.py que pytest busca por defecto)
pythonpath = .
testpaths = tests
python_files = security_tests.py
markers =
    llm: llama al LLM real de OpenAI (lento y con costo). Excluirlos con: pytest -m "not llm"
filterwarnings =
    ignore::DeprecationWarning
